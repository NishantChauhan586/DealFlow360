<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DealFlow360 — Deal Operations</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root{
    --burnham: #00221C;
    --burnham-700: #06342B;
    --burnham-600: #0C4438;
    --viridian: #438A7E;
    --viridian-600: #367065;
    --viridian-300: #86B3A9;
    --viridian-100: #DCEAE6;
    --paper: #F5F7F6;
    --paper-2: #EAF0EE;
    --ink: #08201A;
    --ink-60: rgba(8,32,26,0.6);
    --ink-40: rgba(8,32,26,0.4);
    --amber: #C07A38;
    --amber-100: #F3E3CE;
    --rose: #B04A3D;
    --rose-100: #F1DAD5;
    --line: rgba(8,32,26,0.12);
    --line-dark: rgba(220,234,230,0.14);
    --white: #FFFFFF;
    --radius: 4px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--viridian-300); color:var(--burnham);}
  button{font-family:inherit;}
  .tnum{font-variant-numeric:tabular-nums;}

  /* ---------- App shell ---------- */
  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:236px; flex-shrink:0;
    background:var(--burnham);
    color:var(--viridian-100);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{
    padding:26px 22px 20px;
    border-bottom:1px solid var(--line-dark);
  }
  .sidebar-brand .mark{
    font-family:var(--serif); font-weight:900; font-size:22px;
    letter-spacing:-0.01em; color:var(--white); line-height:1;
  }
  .sidebar-brand .tag{
    font-size:11px; color:var(--viridian-300); margin-top:6px;
    letter-spacing:0.02em;
  }
  .nav{padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:var(--radius);
    color:rgba(220,234,230,0.72); background:transparent; border:none;
    text-align:left; cursor:pointer; font-size:13.5px; font-weight:500;
    transition:background .15s ease, color .15s ease;
    width:100%;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0; opacity:0.9;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:var(--white);}
  .nav-item.active{background:var(--viridian); color:var(--white);}
  .nav-section-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:rgba(220,234,230,0.38); padding:16px 12px 6px;
  }
  .sidebar-footer{
    padding:16px 22px 20px; border-top:1px solid var(--line-dark);
    font-size:12px; color:rgba(220,234,230,0.5);
    display:flex; align-items:center; gap:10px;
  }
  .avatar{
    width:28px; height:28px; border-radius:50%;
    background:var(--viridian-300); color:var(--burnham);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12px; flex-shrink:0;
  }

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; border-bottom:1px solid var(--line);
    background:var(--white);
  }
  .topbar h1{
    font-family:var(--serif); font-weight:700; font-size:21px; margin:0;
    letter-spacing:-0.01em;
  }
  .topbar .sub{font-size:12.5px; color:var(--ink-60); margin-top:3px;}
  .topbar-actions{display:flex; gap:10px;}

  .btn{
    border-radius:var(--radius); border:1px solid var(--line);
    background:var(--white); color:var(--ink);
    font-size:13px; font-weight:600; padding:9px 15px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
  }
  .btn-primary{background:var(--viridian); border-color:var(--viridian); color:var(--white);}
  .btn-primary:hover{background:var(--viridian-600);}
  .btn-dark{background:var(--burnham); border-color:var(--burnham); color:var(--white);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{background:var(--white); border-color:var(--rose); color:var(--rose);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .content{padding:28px 32px 60px; flex:1;}

  /* ---------- Hero (three.js) ---------- */
  .hero{
    position:relative; background:var(--burnham); border-radius:8px;
    overflow:hidden; height:230px; margin-bottom:26px;
    display:flex; align-items:center;
  }
  .hero canvas{position:absolute; inset:0; width:100%; height:100%;}
  .hero-copy{position:relative; z-index:2; padding:0 40px; color:var(--white); max-width:520px;}
  .hero-copy .eyebrow{font-size:12px; color:var(--viridian-300); font-weight:600; margin-bottom:8px;}
  .hero-copy h2{font-family:var(--serif); font-weight:700; font-size:32px; line-height:1.08; margin:0 0 12px; letter-spacing:-0.01em;}
  .hero-copy p{font-size:13.5px; color:rgba(220,234,230,0.75); margin:0; line-height:1.5;}
  .hero-stat{
    position:relative; z-index:2; margin-left:auto; padding-right:44px; text-align:right;
    color:var(--white);
  }
  .hero-stat .num{font-family:var(--serif); font-weight:800; font-size:44px; line-height:1;}
  .hero-stat .lbl{font-size:12px; color:rgba(220,234,230,0.65); margin-top:6px;}

  /* ---------- Stat cards ---------- */
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .stat-card{
    background:var(--white); border:1px solid var(--line); border-radius:6px;
    padding:16px 18px;
  }
  .stat-card .lbl{font-size:12px; color:var(--ink-60); margin-bottom:8px;}
  .stat-card .val{font-family:var(--serif); font-weight:700; font-size:26px;}
  .stat-card .delta{font-size:11.5px; margin-top:6px; font-weight:600;}
  .delta-up{color:var(--viridian-600);}
  .delta-down{color:var(--rose);}

  .panel{
    background:var(--white); border:1px solid var(--line); border-radius:6px;
    overflow:hidden;
  }
  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 18px; border-bottom:1px solid var(--line);
  }
  .panel-header h3{font-family:var(--serif); font-size:16px; font-weight:700; margin:0;}
  .panel-body{padding:6px 0;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}

  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .row:last-child{border-bottom:none;}
  .row-title{font-weight:600;}
  .row-sub{color:var(--ink-60); font-size:12px; margin-top:2px;}
  .tag{
    font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .tag-amber{background:var(--amber-100); color:var(--amber);}
  .tag-rose{background:var(--rose-100); color:var(--rose);}
  .tag-green{background:var(--viridian-100); color:var(--viridian-600);}

  /* ---------- Pipeline ---------- */
  .kanban{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; align-items:start;}
  .kcol-head{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--ink-60); padding:0 4px 10px; display:flex; justify-content:space-between;
  }
  .kcard{
    background:var(--white); border:1px solid var(--line); border-radius:6px;
    padding:13px 14px; margin-bottom:10px; cursor:pointer;
  }
  .kcard:hover{border-color:var(--viridian-300);}
  .kcard .cust{font-weight:700; font-size:13.5px; margin-bottom:4px;}
  .kcard .amt{font-family:var(--serif); font-weight:700; font-size:17px; margin:6px 0 8px;}
  .kcard .meta{font-size:11px; color:var(--ink-60); display:flex; justify-content:space-between;}

  /* ---------- Quotation builder ---------- */
  .builder{display:grid; grid-template-columns:280px 1fr 300px; gap:16px; align-items:start;}
  .catalog-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 14px; border-bottom:1px solid var(--line); font-size:13px;
  }
  .catalog-item .name{font-weight:600;}
  .catalog-item .cat{font-size:11px; color:var(--ink-60);}
  .add-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--viridian);
    color:var(--viridian); background:var(--white); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .add-btn:hover{background:var(--viridian); color:var(--white);}

  table.cart{width:100%; border-collapse:collapse; font-size:13px;}
  table.cart th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--ink-60); padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600;
  }
  table.cart td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{
    width:22px; height:22px; border-radius:4px; border:1px solid var(--line);
    background:var(--white); cursor:pointer; font-size:13px; line-height:1;
  }
  .disc-input{
    width:52px; padding:5px 6px; border:1px solid var(--line); border-radius:4px;
    font-size:12.5px; text-align:right;
  }
  .disc-input.over{border-color:var(--rose); color:var(--rose); background:var(--rose-100);}

  .margin-box{padding:18px;}
  .margin-num{font-family:var(--serif); font-weight:800; font-size:34px; color:var(--viridian-600);}
  .margin-bar{height:6px; background:var(--paper-2); border-radius:4px; margin:10px 0 4px; overflow:hidden;}
  .margin-bar .fill{height:100%; background:var(--viridian); border-radius:4px;}

  .upsell-item{padding:13px 18px; border-bottom:1px solid var(--line);}
  .upsell-item .name{font-weight:700; font-size:13px;}
  .upsell-item .delta{font-size:12px; color:var(--viridian-600); font-weight:600; margin:3px 0 8px;}
  .upsell-actions{display:flex; gap:8px;}
  .upsell-actions button{font-size:11.5px; padding:5px 10px;}

  /* ---------- Approval ---------- */
  .risk-wrap{display:flex; gap:26px; align-items:center; padding:22px;}
  .risk-meta{flex:1;}
  .risk-meta h4{font-family:var(--serif); font-size:18px; margin:0 0 6px;}
  .risk-meta p{font-size:13px; color:var(--ink-60); margin:0; line-height:1.5;}
  .steps{padding:4px 18px 18px;}
  .step{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  .step:last-child{border-bottom:none;}
  .step-dot{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    color:var(--white); background:var(--ink-40);
  }
  .step-dot.done{background:var(--viridian);}
  .step-dot.pending{background:var(--amber);}
  .step-title{font-weight:700; font-size:13.5px;}
  .step-sub{font-size:12px; color:var(--ink-60); margin-top:2px;}

  /* ---------- Fulfillment ---------- */
  .wh-row{display:flex; align-items:center; gap:16px; padding:14px 18px; border-bottom:1px solid var(--line);}
  .wh-row:last-child{border-bottom:none;}
  .wh-name{font-weight:700; font-size:13.5px; width:150px;}
  .wh-bar-track{flex:1; height:10px; background:var(--paper-2); border-radius:6px; overflow:hidden;}
  .wh-bar-fill{height:100%; background:var(--viridian);}
  .wh-qty{width:90px; text-align:right; font-size:13px; font-weight:600;}

  .backorder-banner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--amber-100); border:1px solid var(--amber); color:#7A4E22;
    border-radius:6px; padding:13px 18px; margin-top:14px; font-size:13px;
  }

  /* ---------- Subscriptions ---------- */
  .bill-line{display:flex; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); font-size:13px;}
  .timeline{display:flex; gap:10px; padding:18px; overflow-x:auto;}
  .tl-item{
    min-width:110px; border:1px solid var(--line); border-radius:6px; padding:12px;
    text-align:center; flex-shrink:0;
  }
  .tl-item .date{font-size:11px; color:var(--ink-60);}
  .tl-item .amt{font-family:var(--serif); font-weight:700; font-size:16px; margin-top:6px;}

  /* ---------- Portal ---------- */
  .portal-wrap{max-width:760px; margin:0 auto;}
  .portal-badge{
    display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700;
    color:var(--viridian-600); background:var(--viridian-100); padding:5px 12px;
    border-radius:20px; margin-bottom:14px;
  }
  .portal-card{background:var(--white); border:1px solid var(--line); border-radius:8px; padding:26px;}
  .portal-total{font-family:var(--serif); font-weight:800; font-size:38px; margin:6px 0 2px;}
  .comment-box{
    width:100%; border:1px solid var(--line); border-radius:6px; padding:12px;
    font-family:inherit; font-size:13px; resize:vertical; min-height:70px; margin-top:6px;
  }
  .field-label{font-size:12px; font-weight:700; color:var(--ink-60); margin-bottom:6px; margin-top:18px;}

  .fade-target{opacity:0;}

  @media (max-width: 1080px){
    .builder{grid-template-columns:1fr;}
    .kanban{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ===================== ICONS ===================== */
const Icon = ({ d, ...p }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>
    {d}
  </svg>
);
const IconDash = (p) => <Icon {...p} d={<><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></>} />;
const IconPipe = (p) => <Icon {...p} d={<><path d="M4 4h4v16H4z"/><path d="M10 4h4v10h-4z"/><path d="M16 4h4v6h-4z"/></>} />;
const IconCart = (p) => <Icon {...p} d={<><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.8h8.4a2 2 0 0 0 2-1.6L21 7H6"/></>} />;
const IconCheck = (p) => <Icon {...p} d={<><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></>} />;
const IconTruck = (p) => <Icon {...p} d={<><rect x="1" y="6" width="14" height="11"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></>} />;
const IconRefresh = (p) => <Icon {...p} d={<><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 10a8 8 0 0 0-14.9-3.5M4 14a8 8 0 0 0 14.9 3.5"/></>} />;
const IconUsers = (p) => <Icon {...p} d={<><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.5 13.2a5.5 5.5 0 0 1 5.9 5.5"/></>} />;

/* ===================== MOCK DATA ===================== */
const catalog = [
  { id:'p1', name:'Orion Laptop 14"', cat:'Hardware', price:1450, cost:1015, ceiling:15 },
  { id:'p2', name:'Onsite Setup Service', cat:'Services', price:600, cost:480, ceiling:10 },
  { id:'p3', name:'Extended Care Plan', cat:'Services', price:220, cost:150, ceiling:10 },
  { id:'p4', name:'Docking Station', cat:'Hardware', price:180, cost:110, ceiling:15 },
  { id:'p5', name:'Fleet Manager (Sub)', cat:'Subscription', price:39, cost:12, ceiling:12 },
  { id:'p6', name:'Security Suite (Sub)', cat:'Subscription', price:24, cost:8, ceiling:12 },
];

const upsells = [
  { id:'u1', name:'Extended Care Plan', delta:'+$70 margin', tag:'Promoted' },
  { id:'u2', name:'Docking Station ×2', delta:'+$140 margin', tag:null },
];

const stalledDeals = [
  { cust:'Marlowe & Finch', amt:'$48,200', days:9, rep:'S. Adeyemi' },
  { cust:'Halcyon Textiles', amt:'$21,900', days:14, rep:'R. Okafor' },
  { cust:'Bramwell Group', amt:'$63,000', days:6, rep:'J. Vance' },
];

const anomalies = [
  { cust:'Acme Corp', note:'18% given on Services, 10% allowed', level:'High' },
  { cust:'Northwind Retail', note:'Blended overage across 4 lines', level:'Medium' },
  { cust:'Sable & Co', note:'Discount 3× rep\u2019s 90-day average', level:'High' },
];

const pipelineData = {
  Draft: [ { cust:'Widget Holdings', amt:'$12,400', rep:'S. Adeyemi' }, { cust:'Faircourt Ltd', amt:'$8,050', rep:'J. Vance' } ],
  'Pending Approval': [ { cust:'Acme Corp', amt:'$34,900', rep:'S. Adeyemi' }, { cust:'Northwind Retail', amt:'$19,200', rep:'R. Okafor' } ],
  Approved: [ { cust:'Bramwell Group', amt:'$63,000', rep:'J. Vance' } ],
  Fulfillment: [ { cust:'Delacroix Labs', amt:'$27,300', rep:'R. Okafor' } ],
  Billed: [ { cust:'Sable & Co', amt:'$15,600', rep:'S. Adeyemi' } ],
};

/* ===================== THREE.JS HERO ===================== */
function HeroCanvas(){
  const mount = useRef(null);
  useEffect(() => {
    const el = mount.current;
    const width = el.clientWidth, height = el.clientHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, width/height, 0.1, 100);
    camera.position.z = 9;
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    el.appendChild(renderer.domElement);

    const COUNT = 260;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT * 3);
    const speeds = new Float32Array(COUNT);
    for(let i=0;i<COUNT;i++){
      positions[i*3] = (Math.random()-0.5)*16;
      positions[i*3+1] = (Math.random()-0.5)*7;
      positions[i*3+2] = (Math.random()-0.5)*6;
      speeds[i] = 0.15 + Math.random()*0.35;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const mat = new THREE.PointsMaterial({ color:0x86B3A9, size:0.055, transparent:true, opacity:0.85 });
    const points = new THREE.Points(geo, mat);
    scene.add(points);

    // faint connecting lines to suggest "flow"
    const lineGeo = new THREE.BufferGeometry();
    const lineMat = new THREE.LineBasicMaterial({ color:0x438A7E, transparent:true, opacity:0.18 });
    const lineCount = 60;
    const linePos = new Float32Array(lineCount * 2 * 3);
    lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos,3));
    const lines = new THREE.LineSegments(lineGeo, lineMat);
    scene.add(lines);

    let raf;
    const clock = new THREE.Clock();
    const animate = () => {
      const t = clock.getElapsedTime();
      const pos = geo.attributes.position.array;
      for(let i=0;i<COUNT;i++){
        pos[i*3] += speeds[i]*0.015;
        if(pos[i*3] > 8) pos[i*3] = -8;
        pos[i*3+1] += Math.sin(t*0.6 + i)*0.0009;
      }
      geo.attributes.position.needsUpdate = true;

      const lp = lineGeo.attributes.position.array;
      for(let i=0;i<lineCount;i++){
        const a = i, b = (i*7+3) % COUNT;
        lp[i*6] = pos[a*3]; lp[i*6+1] = pos[a*3+1]; lp[i*6+2] = pos[a*3+2];
        lp[i*6+3] = pos[b*3]; lp[i*6+4] = pos[b*3+1]; lp[i*6+5] = pos[b*3+2];
      }
      lineGeo.attributes.position.needsUpdate = true;

      points.rotation.y = t*0.02;
      lines.rotation.y = t*0.02;
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };
    animate();

    const onResize = () => {
      const w = el.clientWidth, h = el.clientHeight;
      camera.aspect = w/h; camera.updateProjectionMatrix();
      renderer.setSize(w,h);
    };
    window.addEventListener('resize', onResize);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      el.removeChild(renderer.domElement);
    };
  }, []);
  return <div ref={mount} style={{position:'absolute', inset:0}} />;
}

/* ===================== ANIM HELPERS ===================== */
function useEnter(deps){
  const ref = useRef(null);
  useEffect(() => {
    if(!ref.current) return;
    const targets = ref.current.querySelectorAll('.fade-target');
    gsap.fromTo(targets, { opacity:0, y:14 }, { opacity:1, y:0, duration:0.55, ease:'power2.out', stagger:0.06 });
  }, deps);
  return ref;
}
function CountUp({ value, prefix='', decimals=0 }){
  const ref = useRef(null);
  useEffect(() => {
    const obj = { v: 0 };
    gsap.to(obj, {
      v: value, duration: 0.9, ease:'power2.out',
      onUpdate: () => { if(ref.current) ref.current.textContent = prefix + obj.v.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    });
  }, [value]);
  return <span ref={ref} className="tnum">{prefix}0</span>;
}

/* ===================== QUOTATION BUILDER ===================== */
function Builder(){
  const ref = useEnter([]);
  const [lines, setLines] = useState([
    { id:'p1', qty:1, discount:12 },
    { id:'p2', qty:1, discount:18 },
  ]);

  const addProduct = (id) => {
    setLines(prev => {
      const existing = prev.find(l => l.id===id);
      if(existing) return prev.map(l => l.id===id ? {...l, qty:l.qty+1} : l);
      return [...prev, { id, qty:1, discount:0 }];
    });
  };
  const updateQty = (id, d) => setLines(prev => prev.map(l => l.id===id ? {...l, qty:Math.max(1,l.qty+d)} : l));
  const updateDiscount = (id, val) => setLines(prev => prev.map(l => l.id===id ? {...l, discount:Math.max(0, val)} : l));

  const enriched = lines.map(l => ({ ...l, product: catalog.find(p => p.id===l.id) }));
  const subtotal = enriched.reduce((s,l) => s + l.product.price*l.qty, 0);
  const discountTotal = enriched.reduce((s,l) => s + l.product.price*l.qty*(l.discount/100), 0);
  const total = subtotal - discountTotal;
  const cost = enriched.reduce((s,l) => s + l.product.cost*l.qty, 0);
  const marginPct = total > 0 ? Math.max(0, ((total-cost)/total)*100) : 0;

  return (
    <div ref={ref} className="builder">
      <div className="panel fade-target">
        <div className="panel-header"><h3>Catalog</h3></div>
        <div className="panel-body">
          {catalog.map(p => (
            <div className="catalog-item" key={p.id}>
              <div>
                <div className="name">{p.name}</div>
                <div className="cat">{p.cat} · ${p.price}</div>
              </div>
              <button className="add-btn" onClick={() => addProduct(p.id)}>+</button>
            </div>
          ))}
        </div>
      </div>

      <div className="panel fade-target">
        <div className="panel-header"><h3>Quotation — Acme Corp</h3><span className="tag tag-green">Gold tier</span></div>
        <table className="cart">
          <thead>
            <tr><th>Line</th><th>Qty</th><th>Discount</th><th style={{textAlign:'right'}}>Total</th></tr>
          </thead>
          <tbody>
            {enriched.map(l => {
              const over = l.discount > l.product.ceiling;
              return (
                <tr key={l.id}>
                  <td>
                    <div style={{fontWeight:600}}>{l.product.name}</div>
                    <div style={{fontSize:11, color:'var(--ink-60)'}}>{l.product.cat} · ceiling {l.product.ceiling}%</div>
                  </td>
                  <td>
                    <div className="qty-ctrl">
                      <button onClick={() => updateQty(l.id,-1)}>−</button>
                      <span className="tnum">{l.qty}</span>
                      <button onClick={() => updateQty(l.id,1)}>+</button>
                    </div>
                  </td>
                  <td>
                    <input className={"disc-input" + (over ? " over":"")} type="number" value={l.discount}
                      onChange={e => updateDiscount(l.id, Number(e.target.value))} />%
                    {over && <div style={{fontSize:10.5, color:'var(--rose)', marginTop:3}}>+{(l.discount-l.product.ceiling)} pts over</div>}
                  </td>
                  <td style={{textAlign:'right', fontWeight:600}} className="tnum">
                    ${Math.round(l.product.price*l.qty*(1-l.discount/100)).toLocaleString()}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="row" style={{borderTop:'1px solid var(--line)'}}>
          <span className="row-sub">Subtotal ${subtotal.toLocaleString()} · Discount −${Math.round(discountTotal).toLocaleString()}</span>
          <span style={{fontFamily:'var(--serif)', fontWeight:700, fontSize:19}} className="tnum">${Math.round(total).toLocaleString()}</span>
        </div>
      </div>

      <div style={{display:'flex', flexDirection:'column', gap:16}}>
        <div className="panel fade-target">
          <div className="panel-header"><h3>Live margin</h3></div>
          <div className="margin-box">
            <div className="margin-num"><CountUp value={marginPct} decimals={1} />%</div>
            <div className="margin-bar"><div className="fill" style={{width: Math.min(100,marginPct)+'%'}}></div></div>
            <div style={{fontSize:11.5, color:'var(--ink-60)'}}>Updates instantly as lines and discounts change</div>
          </div>
        </div>
        <div className="panel fade-target">
          <div className="panel-header"><h3>Upsell suggestions</h3></div>
          <div className="panel-body">
            {upsells.map(u => (
              <div className="upsell-item" key={u.id}>
                <div className="name">{u.name} {u.tag && <span className="tag tag-green" style={{marginLeft:6}}>{u.tag}</span>}</div>
                <div className="delta">{u.delta}</div>
                <div className="upsell-actions">
                  <button className="btn btn-primary" onClick={() => addProduct(u.id==='u1' ? 'p3':'p4')}>Add to quote</button>
                  <button className="btn btn-ghost">Dismiss</button>
                </div>
              </div>
            ))}
          </div>
        </div>
        <button className="btn btn-dark" style={{justifyContent:'center'}}>Send for approval →</button>
      </div>
    </div>
  );
}
